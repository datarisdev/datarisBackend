[project]
name = "backend-dataris"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "google-cloud-storage>=2.18",
  "requests>=2.32",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "rasterio>=1.3.9",
  "geopandas>=0.14",
  "numpy>=1.26",
  "pillow>=10.0",
  "pystac-client>=0.7",
  "planetary-computer>=1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "api*"]
exclude = ["alembic*", "scripts*", "tests*", ".github*", ".idea*"]
